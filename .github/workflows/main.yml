name: Build VST3 (Windows x64)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S StereoToolPro -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $vst = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          if ($null -eq $vst) { throw "No se encontro el .vst3" }
          Copy-Item -Path $vst.FullName -Destination dist -Recurse

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StereoToolPro-VST3-Windows-x64
          path: dist
